    <script type="text/javascript">
      (() => {
        const e = ['m','a','i','l','t','o',':','i','s','a','r','t','e','2','7','3','2','@','g','m','a','i','l','.','c','o','m'];
        const email = e.join('');
        const emailLink = document.getElementById('email-link');
        const emailFooter = document.getElementById('email-footer');
        if (emailLink) emailLink.href = email;
        if (emailFooter) emailFooter.href = email;

        const linkNames = {
          'tiktok.com': 'TikTok',
          'cardmarket.com': 'CardMarket',
          'instagram.com': 'Instagram',
          'mailto:': 'Email'
        };
        document.querySelectorAll('a').forEach(a => {
          if (a.host !== window.location.host && !a.getAttribute('data-umami-event')) {
            let name = 'outbound-link';
            const href = a.href;
            for (const [key, val] of Object.entries(linkNames)) {
              if (href.includes(key)) { name = val; break; }
            }
            a.setAttribute('data-umami-event', name);
            a.setAttribute('data-umami-event-url', href);
          }
        });
      })();
    </script>
